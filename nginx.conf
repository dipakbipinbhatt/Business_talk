server {
    listen 80 default_server;
    server_name _; # Catches IP address and everything else
    
    # Redirect everything to the main HTTPS domain
    return 301 https://businesstalkwithdeepakbhatt.com$request_uri;
}

server {
    listen 443 ssl;
    # REMOVED: listen 443 quic;  <-- This was likely causing the error
    # REMOVED: http2;            <-- Temporarily disabling http2 to ensure maximum compatibility
    
    server_name businesstalkwithdeepakbhatt.com www.businesstalkwithdeepakbhatt.com;

    # SSL Configuration (Standard)
    ssl_certificate /etc/letsencrypt/live/businesstalkwithdeepakbhatt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/businesstalkwithdeepakbhatt.com/privkey.pem;
    
    # IMPORTANT: Ensure no Alt-Svc header is sent to prevent QUIC upgrade
    add_header Alt-Svc ""; 
    add_header X-Protocol-Used "HTTP/1.1 or HTTP/2"; # Debug header
    
    # Frontend - Serve static files
    root /var/www/business-talk/frontend;
    index index.html;

    # Frontend - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache settings for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Backend API - Proxy to Node.js
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
