# ============================================
# NGINX MAIN CONFIGURATION - PERFORMANCE OPTIMIZED
# ============================================

user nginx;
worker_processes auto;  # Auto-detect CPU cores
worker_rlimit_nofile 65535;  # Maximum file descriptors
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker process optimizations
events {
    worker_connections 4096;  # Increased from default 1024
    use epoll;  # Efficient connection processing
    multi_accept on;  # Accept multiple connections at once
}

http {
    # ============================================
    # BASIC SETTINGS
    # ============================================
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ============================================
    # PERFORMANCE OPTIMIZATIONS
    # ============================================
    
    # File I/O optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Connection optimizations
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Hash table optimizations
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    
    # Hide nginx version
    server_tokens off;
    
    # Client settings
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Buffer optimizations
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # ============================================
    # GZIP COMPRESSION
    # ============================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_disable "msie6";
    
    # ============================================
    # FILE CACHE
    # ============================================
    
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # ============================================
    # INCLUDE SITE CONFIGURATIONS
    # ============================================
    
    include /etc/nginx/conf.d/*.conf;
}
