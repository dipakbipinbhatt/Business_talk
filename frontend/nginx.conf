# SUPER OPTIMIZED NGINX CONFIGURATION
# Corrected for inclusion in conf.d/default.conf (Running inside existing http block)

# CORE PERFORMANCE SETTINGS
sendfile on;                # Zero copy file transfer
tcp_nopush on;             # Send headers in one packet
tcp_nodelay on;            # Don't buffer data headers
keepalive_timeout 65;      # Keep connections open longer
keepalive_requests 1000;   # Allow more requests per connection
reset_timedout_connection on; # Free ephemeral ports immediately
client_body_timeout 10;
send_timeout 2;

# CACHE FILE DESCRIPTORS (Reduces Disk I/O)
open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# GZIP COMPRESSION (Tuned for Speed vs CPU)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;         # Reduced from 6 to 4 to save CPU on SSL
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/svg+xml
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/markdown
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# HTTP SERVER
server {
    listen 80;
    server_name _;
    
    # Security: Redirect IP to HTTPS
    if ($host = "68.178.161.128") {
        return 301 https://businesstalkwithdeepakbhatt.com$request_uri;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Allow loader.io verification on HTTP
    location ~ /loaderio-.*\.txt$ {
        proxy_pass http://backend:5000;
    }
}

# SSL SERVER (HTTPS)
server {
    listen 443 ssl http2;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSL CERTIFICATES
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # SSL OPTIMIZATION (Speed + Security)
    ssl_session_cache shared:SSL:50m; # Increased cache size
    ssl_session_timeout 1d;           # Longer timeout
    ssl_session_tickets off;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    # Modern, fast cipher suites
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    ssl_buffer_size 4k; # Low latency

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # SECURITY HEADERS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # STATIC ASSETS CACHING (Aggressive)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webmanifest|xml)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # API PROXY (Backend)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts & Buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # REACT ROUTER (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

