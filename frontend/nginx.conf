# ============================================
# NGINX PERFORMANCE OPTIMIZED CONFIGURATION
# ============================================

# HTTP Server - Fast redirect to HTTPS
server {
    listen 80;
    server_name _;
    
    # Fast redirect to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server - Optimized for Maximum Performance
server {
    listen 443 ssl http2;
    server_name businesstalkwithdeepakbhatt.com www.businesstalkwithdeepakbhatt.com;

    # ============================================
    # SSL CONFIGURATION - OPTIMIZED
    # ============================================
    
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    
    # Modern SSL protocols only
    ssl_protocols TLSv1.3 TLSv1.2;
    
    # Optimized cipher suites for speed and security
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session Caching - CRITICAL for performance
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP Stapling - Faster certificate validation
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ============================================
    # SECURITY HEADERS - MINIMAL OVERHEAD
    # ============================================
    
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================
    # PERFORMANCE OPTIMIZATIONS
    # ============================================
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Disable access logs for static files (faster)
    access_log off;
    error_log /var/log/nginx/error.log warn;
    
    # Enable sendfile for faster file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Keep-alive connections (reuse connections)
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Client body optimizations
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ============================================
    # GZIP COMPRESSION - MAXIMUM SPEED
    # ============================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;  # Balanced: 5 is faster than 6, still good compression
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
    
    # Disable gzip for IE6
    gzip_disable "msie6";

    # ============================================
    # STATIC ASSETS - AGGRESSIVE CACHING
    # ============================================
    
    # Images, fonts, media - cache for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot|otf|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Enable gzip for SVG
        gzip_static on;
    }
    
    # CSS and JavaScript - cache for 1 year (with versioning)
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }
    
    # HTML files - short cache with revalidation
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ============================================
    # API PROXY - OPTIMIZED
    # ============================================
    
    location /api/ {
        # Proxy to backend
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Buffering - improves performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Timeouts - optimized
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Disable cache for API
        proxy_cache_bypass $http_upgrade;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ============================================
    # REACT ROUTER - OPTIMIZED
    # ============================================
    
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add cache control for index.html
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ============================================
    # ERROR HANDLING
    # ============================================
    
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
