# FINAL ULTRA-FAST CONFIGURATION (2 vCPU Optimized)
# 1. Unlocked CPU Limits (Docker) -> Gzip Level 5 (Smaller files, faster load)
# 2. Connection Pooling -> Instant API response
# 3. Optimized Buffers -> High concurrency handling

# Upstream block for Backend Connection Pooling
upstream backend_upstream {
    server backend:5000;
    keepalive 64;
}

# HTTP SERVER
server {
    listen 80;
    server_name _;
    
    # PERFORMANCE SETTINGS
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 2000; # Increased for high traffic
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 2;

    # GZIP (Level 5 - Best balance for 2 vCPUs)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml application/geo+json application/javascript
        application/x-javascript application/json application/ld+json
        application/manifest+json application/rdf+xml application/rss+xml
        application/vnd.ms-fontobject application/wasm application/x-web-app-manifest+json
        application/xhtml+xml application/xml font/eot font/otf font/ttf
        image/bmp image/svg+xml text/cache-manifest text/calendar
        text/css text/javascript text/markdown text/plain text/vcard
        text/vnd.rim.location.xloc text/vtt text/x-component
        text/x-cross-domain-policy;
    
    # Redirect IP to HTTPS
    if ($host = "68.178.161.128") {
        return 301 https://businesstalkwithdeepakbhatt.com$request_uri;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Allow loader.io verification on HTTP
    location ~ /loaderio-.*\.txt$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# SSL SERVER (HTTPS)
server {
    listen 443 ssl http2;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSL CERTIFICATES
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # PERFORMANCE SETTINGS
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 2000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 2;

    # Cache File Descriptors
    open_file_cache max=50000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # GZIP (Level 5 - Optimized for 2 vCPU)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml application/geo+json application/javascript
        application/x-javascript application/json application/ld+json
        application/manifest+json application/rdf+xml application/rss+xml
        application/vnd.ms-fontobject application/wasm application/x-web-app-manifest+json
        application/xhtml+xml application/xml font/eot font/otf font/ttf
        image/bmp image/svg+xml text/cache-manifest text/calendar
        text/css text/javascript text/markdown text/plain text/vcard
        text/vnd.rim.location.xloc text/vtt text/x-component
        text/x-cross-domain-policy;

    # SSL OPTIMIZATION
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # Optimized SSL buffer for throughput
    ssl_buffer_size 16k;

    # OCSP Stapling (Disabled for safety)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # SECURITY HEADERS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # STATIC ASSETS CACHING (Aggressive)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webmanifest|xml)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
        
        # Enable Thread Pools for static file serving? (Standard in Nginx 1.25+)
        # aio threads; 
    }

    # API PROXY (Backend) - Optimized with Keepalive
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Important for KeepAlive
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts & Buffers (Doubled for concurrency)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 32 4k;
        proxy_busy_buffers_size 16k;
    }

    # REACT ROUTER (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

